services:
  n8n:
    image: n8nio/n8n:latest
    container_name: intelligent-invoice-platform-n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:${N8N_PORT:-5678}/
      - TZ=Africa/Tunis
      - GENERIC_TIMEZONE=Africa/Tunis
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/shared
      - N8N_BINARY_DATA_MODE=filesystem
    volumes:
      - ./n8n:/home/node/.n8n
      - ./shared:/shared
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ocrservice:
        condition: service_started
      extractionservice:
        condition: service_started
      extractionserviceocr:
        condition: service_started
      validationservice:
        condition: service_started
      teif-api:
        condition: service_started
      signature-api:
        condition: service_healthy
      ttn-orchestrator-api:
        condition: service_started
      mock-signature-orchestrator-api:
        condition: service_healthy
    networks:
      - invoice-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: intelligent-invoice-platform-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - invoice-network
    restart: unless-stopped

  pdfservice:
    build:
      context: ./services/pdfservice
    container_name: intelligent-invoice-platform-pdfservice
    environment:
      - SHARED_DIR=/shared
    volumes:
      - ./shared:/shared
    ports:
      - "8001:8000"
    networks:
      - invoice-network
    restart: unless-stopped

  ocrservice:
    build:
      context: ./services/ocrservice
    container_name: intelligent-invoice-platform-ocrservice
    environment:
      - SHARED_DIR=/shared
    volumes:
      - ./shared:/shared
    ports:
      - "8002:8000"
    networks:
      - invoice-network
    restart: unless-stopped

  extractionservice:
    build:
      context: ./services/extractionservice
    container_name: intelligent-invoice-platform-extractionservice
    environment:
      - SHARED_DIR=/shared
      - OLLAMA_URL=http://ollama:11434/api/chat
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
      - OLLAMA_TIMEOUT=120
      - OLLAMA_NUM_CTX=4096
      - OLLAMA_NUM_PREDICT=400
      - OLLAMA_CHUNK_MAX_CHARS=6000
    volumes:
      - ./shared:/shared
    ports:
      - "8003:8000"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - invoice-network
    restart: unless-stopped

  extractionserviceocr:
    build:
      context: ./services/extractionserviceocr
    container_name: intelligent-invoice-platform-extractionserviceocr
    ports:
      - "8005:8000"
    volumes:
      - ./shared:/shared
    environment:
      - SHARED_DIR=/shared
    depends_on:
      ocrservice:
        condition: service_started
    networks:
      - invoice-network
    restart: unless-stopped

  validationservice:
    build:
      context: ./services/validationservice
    container_name: intelligent-invoice-platform-validationservice
    environment:
      - SHARED_DIR=/shared
    volumes:
      - ./shared:/shared
    ports:
      - "8004:8000"
    networks:
      - invoice-network
    restart: unless-stopped

  teif-api:
    build:
      context: ./services/teif-api
    container_name: intelligent-invoice-platform-teif-api
    ports:
      - "5004:5000"
    volumes:
      - ./shared:/shared
    networks:
      - invoice-network
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=s211JFT2523
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - invoice-network
    restart: unless-stopped

  signature-api:
    build:
      context: ./services/signature-api
    container_name: signature-api
    ports:
      - "5002:5001"
    environment:
      - SHARED_DIR=/shared
    volumes:
      - ./shared:/shared
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - invoice-network
    restart: unless-stopped

  ttn-orchestrator-api:
    build:
      context: ./services/ttn-orchestrator-api
    container_name: ttn-orchestrator-api
    ports:
      - "5006:8000"
    environment:
      - MAX_RETRIES=3
      - RETRY_DELAY_SECONDS=300
      - SCHEDULER_POLL_SECONDS=30
      - STORAGE_DIR=/app/storage
      - SHARED_DIR=/shared
    volumes:
      - ./shared:/shared
      - ./services/ttn-orchestrator-api/storage:/app/storage
    networks:
      - invoice-network
    restart: unless-stopped

  

  mock-signature-orchestrator-api:
    build:
      context: ./services/mock-signature-orchestrator-api
    container_name: mock-signature-orchestrator-api
    ports:
      - "5008:8000"
    environment:
      - SIGNATURE_API_URL=http://signature-api:5001
      - MAX_RETRIES=3
      - RETRY_DELAY_SECONDS=300
      - STORAGE_DIR=/app/storage
      - SHARED_DIR=/shared
    volumes:
      - ./shared:/shared
      - ./services/mock-signature-orchestrator-api/storage:/app/storage
    depends_on:
      signature-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - invoice-network
    restart: unless-stopped

networks:
  invoice-network:
    name: intelligent-invoice-platform-network
    driver: bridge

volumes:
  ollama_data:
  sql_data: