services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:${N8N_PORT:-5678}/
      - TZ=Africa/Tunis
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/shared
      - N8N_BINARY_DATA_MODE=filesystem
    volumes:
      - ./n8n:/home/node/.n8n
      - ./shared:/shared
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ocrservice
      - extractionservice
      - validationservice
      - teif-api
      - signature-api

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

  pdfservice:
    build: ./services/pdfservice
    environment:
      - SHARED_DIR=/shared
    volumes:
      - ./shared:/shared
    ports:
      - "8001:8000"

  ocrservice:
    build: ./services/ocrservice
    environment:
      - SHARED_DIR=/shared
    volumes:
      - ./shared:/shared
    ports:
      - "8002:8000"

  extractionservice:
    build: ./services/extractionservice
    environment:
      - SHARED_DIR=/shared
      - OLLAMA_URL=http://ollama:11434/api/chat
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
    volumes:
      - ./shared:/shared
    ports:
      - "8003:8000"
    depends_on:
      - ollama

  validationservice:
    build: ./services/validationservice
    environment:
      - SHARED_DIR=/shared
    volumes:
      - ./shared:/shared
    ports:
      - "8004:8000"

  teif-api:
    build: ./services/teif-api
    ports:
      - "5004:5000"
    volumes:
      - ./shared:/shared

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=s211JFT2523
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  # Signature MOCK / FAKE sans clé USB
  # Dans Docker/n8n : http://signature-api:5001
  # Depuis Windows : http://localhost:5002
  signature-api:
    build:
      context: ./services/signature-api
    container_name: signature-api
    ports:
      - "5002:5001"

volumes:
  ollama_data:
  sql_data: