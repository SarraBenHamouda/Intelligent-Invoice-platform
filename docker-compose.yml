services:

  n8n:
    image: n8nio/n8n:latest

    ports:
      - "${N8N_PORT:-5678}:5678"

    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:${N8N_PORT:-5678}/
      - TZ=Africa/Tunis
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/shared
      - N8N_BINARY_DATA_MODE=filesystem

    volumes:
      - ./n8n:/home/node/.n8n
      - ./shared:/shared

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - ocrservice
      - extractionservice
      - extractionserviceocr
      - validationservice
      - teif-api
      - signature-api
      - ttn-orchestrator-api


  ollama:
    image: ollama/ollama:latest

    ports:
      - "${OLLAMA_PORT:-11434}:11434"

    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1

    volumes:
      - ollama_data:/root/.ollama

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

    restart: unless-stopped


  pdfservice:
    build: ./services/pdfservice

    environment:
      - SHARED_DIR=/shared

    volumes:
      - ./shared:/shared

    ports:
      - "8001:8000"


  ocrservice:
    build: ./services/ocrservice

    environment:
      - SHARED_DIR=/shared

    volumes:
      - ./shared:/shared

    ports:
      - "8002:8000"


  extractionservice:
    build:
      context: ./services/extractionservice

    environment:
      - SHARED_DIR=/shared
      - OLLAMA_URL=http://ollama:11434/api/chat
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
      - OLLAMA_TIMEOUT=120
      - OLLAMA_NUM_CTX=4096
      - OLLAMA_NUM_PREDICT=400
      - OLLAMA_CHUNK_MAX_CHARS=6000

    volumes:
      - ./shared:/shared

    ports:
      - "8003:8000"

    depends_on:
      ollama:
        condition: service_healthy

    restart: unless-stopped


  extractionserviceocr:
    build: ./services/extractionserviceocr

    ports:
      - "8005:8000"

    volumes:
      - ./shared:/shared

    environment:
      - SHARED_DIR=/shared

    depends_on:
      - ocrservice


  validationservice:
    build: ./services/validationservice

    environment:
      - SHARED_DIR=/shared

    volumes:
      - ./shared:/shared

    ports:
      - "8004:8000"


  teif-api:
    build: ./services/teif-api

    ports:
      - "5004:5000"

    volumes:
      - ./shared:/shared


  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: sqlserver

    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=s211JFT2523

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql


  signature-api:
    build:
      context: ./services/signature-api

    container_name: signature-api

    ports:
      - "5002:5001"

    volumes:
      - ./shared:/shared

    restart: unless-stopped


  ttn-orchestrator-api:
    build:
      context: ./services/ttn-orchestrator-api

    container_name: ttn-orchestrator-api

    ports:
      - "5006:8000"

    environment:
      - MAX_RETRIES=3
      - RETRY_DELAY_SECONDS=300
      - SCHEDULER_POLL_SECONDS=30
      - STORAGE_DIR=/app/storage
      - SHARED_DIR=/shared

    volumes:
      - ./shared:/shared
      - ./services/ttn-orchestrator-api/storage:/app/storage

    restart: unless-stopped


volumes:
  ollama_data:
  sql_data: