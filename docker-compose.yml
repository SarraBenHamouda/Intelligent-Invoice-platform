services:
  # ==========================================================
  # N8N
  # ==========================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: intelligent-invoice-platform-n8n

    ports:
      - "${N8N_PORT:-5678}:5678"

    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:${N8N_PORT:-5678}/

      - TZ=Africa/Tunis
      - GENERIC_TIMEZONE=Africa/Tunis

      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/shared
      - N8N_BINARY_DATA_MODE=filesystem

      - NODE_OPTIONS=--max-old-space-size=4096

    volumes:
      - ./n8n:/home/node/.n8n
      - ./shared:/shared

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      ocrservice:
        condition: service_started

      extractionservice:
        condition: service_started

      extractionserviceocr:
        condition: service_started

      validationservice:
        condition: service_started

      teif-api:
        condition: service_started

      signature-api:
        condition: service_healthy

      ttn-orchestrator-api:
        condition: service_started

      mock-signature-orchestrator-api:
        condition: service_healthy

    networks:
      - invoice-network

    restart: unless-stopped

  # ==========================================================
  # OLLAMA
  # ==========================================================
  ollama:
    image: ollama/ollama:latest
    container_name: intelligent-invoice-platform-ollama

    ports:
      - "${OLLAMA_PORT:-11434}:11434"

    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1

    volumes:
      - ollama_data:/root/.ollama

    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

    networks:
      - invoice-network

    restart: unless-stopped

  # ==========================================================
  # PDF SERVICE
  # ==========================================================
  pdfservice:
    build:
      context: ./services/pdfservice

    container_name: intelligent-invoice-platform-pdfservice

    environment:
      - SHARED_DIR=/shared

    volumes:
      - ./shared:/shared

    ports:
      - "8001:8000"

    networks:
      - invoice-network

    restart: unless-stopped

  # ==========================================================
  # OCR SERVICE
  # ==========================================================
  ocrservice:
    build:
      context: ./services/ocrservice

    container_name: intelligent-invoice-platform-ocrservice

    environment:
      - SHARED_DIR=/shared

    volumes:
      - ./shared:/shared

    ports:
      - "8002:8000"

    networks:
      - invoice-network

    restart: unless-stopped

  # ==========================================================
  # PDF TEXT EXTRACTION SERVICE
  # ==========================================================
  extractionservice:
    build:
      context: ./services/extractionservice

    container_name: intelligent-invoice-platform-extractionservice

    environment:
      - SHARED_DIR=/shared
      - OLLAMA_URL=http://ollama:11434/api/chat
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
      - OLLAMA_TIMEOUT=120
      - OLLAMA_NUM_CTX=4096
      - OLLAMA_NUM_PREDICT=400
      - OLLAMA_CHUNK_MAX_CHARS=6000

    volumes:
      - ./shared:/shared

    ports:
      - "8003:8000"

    depends_on:
      ollama:
        condition: service_healthy

    networks:
      - invoice-network

    restart: unless-stopped

  # ==========================================================
  # OCR EXTRACTION SERVICE
  # ==========================================================
  extractionserviceocr:
    build:
      context: ./services/extractionserviceocr

    container_name: intelligent-invoice-platform-extractionserviceocr

    ports:
      - "8005:8000"

    volumes:
      - ./shared:/shared

    environment:
      - SHARED_DIR=/shared

    depends_on:
      ocrservice:
        condition: service_started

    networks:
      - invoice-network

    restart: unless-stopped

  # ==========================================================
  # VALIDATION SERVICE
  # ==========================================================
  validationservice:
    build:
      context: ./services/validationservice

    container_name: intelligent-invoice-platform-validationservice

    environment:
      - SHARED_DIR=/shared

    volumes:
      - ./shared:/shared

    ports:
      - "8004:8000"

    networks:
      - invoice-network

    restart: unless-stopped

  # ==========================================================
  # TEIF GENERATOR API
  # ==========================================================
  teif-api:
    build:
      context: ./services/teif-api

    container_name: intelligent-invoice-platform-teif-api

    ports:
      - "5004:5000"

    volumes:
      - ./shared:/shared

    networks:
      - invoice-network

    restart: unless-stopped

  # ==========================================================
  # XADES SIGNATURE API
  # ==========================================================
  signature-api:
    build:
      context: ./services/signature-api

    container_name: signature-api

    ports:
      - "5002:5001"

    environment:
      - PORT=5001
      - SHARED_DIR=/shared
      - SIGN_MODE=auto
      - SIGN_CERT_THUMBPRINT=${SIGN_CERT_THUMBPRINT:-}

    volumes:
      - ./shared:/shared

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

    networks:
      - invoice-network

    restart: unless-stopped

  # ==========================================================
  # REAL TTN ORCHESTRATOR
  # ==========================================================
  ttn-orchestrator-api:
    build:
      context: ./services/ttn-orchestrator-api

    container_name: ttn-orchestrator-api

    ports:
      - "5006:8000"

    environment:
      - MAX_RETRIES=3
      - RETRY_DELAY_SECONDS=300
      - SCHEDULER_POLL_SECONDS=30
      - STORAGE_DIR=/app/storage
      - SHARED_DIR=/shared

    volumes:
      - ./shared:/shared
      - ./services/ttn-orchestrator-api/storage:/app/storage

    networks:
      - invoice-network

    restart: unless-stopped

  # ==========================================================
  # MOCK SIGNATURE ORCHESTRATOR
  # ==========================================================
  mock-signature-orchestrator-api:
    build:
      context: ./services/mock-signature-orchestrator-api

    container_name: mock-signature-orchestrator-api

    ports:
      - "5008:8000"

    environment:
      - SIGNATURE_API_URL=http://signature-api:5001
      - MAX_RETRIES=3
      - RETRY_DELAY_SECONDS=300
      - STORAGE_DIR=/app/storage
      - SHARED_DIR=/shared

    volumes:
      - ./shared:/shared
      - ./services/mock-signature-orchestrator-api/storage:/app/storage

    depends_on:
      signature-api:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

    networks:
      - invoice-network

    restart: unless-stopped

  # ==========================================================
  # EXPRESS WEBSITE BACKEND
  # ==========================================================
  portal-backend:
    build:
      context: ./backend

    container_name: intelligent-invoice-platform-backend

    ports:
      - "3000:3000"

    environment:
      - NODE_ENV=development
      - PORT=3000
      - FRONTEND_URL=http://localhost:5173

      # SQL Server Windows / SQLEXPRESS
      - DB_SERVER=host.docker.internal
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASSWORD=${SQL_SA_PASSWORD}
      - DB_NAME=InvoicePortal
      - ERP_DB_NAME=ERP223
      - DB_ENCRYPT=false
      - DB_TRUST_SERVER_CERTIFICATE=true

      # Authentication
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}

      # Internal services
      - UPLOAD_DIRECTORY=/shared/uploads
      - N8N_URL=http://n8n:5678
      - N8N_CALLBACK_SECRET=change-me-in-production
      - N8N_ERP_INVOICE_WEBHOOK=/webhook/portal-erp-invoice
      - N8N_REAL_UPLOAD_WEBHOOK=/webhook/portal-upload-real
      - N8N_DEMO_UPLOAD_WEBHOOK=/webhook/portal-upload-demo
      - N8N_RETRY_INVOICE_WEBHOOK=/webhook/portal-invoice-retry
      - PDF_SERVICE_URL=http://pdfservice:8000
      - OCR_SERVICE_URL=http://ocrservice:8000
      - EXTRACTION_SERVICE_URL=http://extractionservice:8000
      - EXTRACTION_OCR_SERVICE_URL=http://extractionserviceocr:8000
      - VALIDATION_SERVICE_URL=http://validationservice:8000
      - TEIF_API_URL=http://teif-api:5000
      - SIGNATURE_API_URL=http://signature-api:5001
      - TTN_ORCHESTRATOR_URL=http://ttn-orchestrator-api:8000
      - MOCK_SIGNATURE_ORCHESTRATOR_URL=http://mock-signature-orchestrator-api:8000

      # Shared files
      - SHARED_DIR=/shared
      - ENV_FILE_PATH=/app/config/ENV.csv
      - MAPPING_FILE_PATH=/app/config/universal_mapping.csv

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./shared:/shared
      - ./ENV.csv:/app/config/ENV.csv:ro
      - ./universal_mapping.csv:/app/config/universal_mapping.csv:ro

    depends_on:
      signature-api:
        condition: service_healthy

      ttn-orchestrator-api:
        condition: service_started

      mock-signature-orchestrator-api:
        condition: service_healthy

    networks:
      - invoice-network

    restart: unless-stopped

# ============================================================
# NETWORK
# ============================================================
networks:
  invoice-network:
    name: intelligent-invoice-platform-network
    driver: bridge

# ============================================================
# VOLUMES
# ============================================================
volumes:
  ollama_data: